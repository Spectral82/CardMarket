<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Магазин{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; }
        .sidebar {
            width: 250px; background-color: #1a1a1a; color: white;
            height: 100vh; position: fixed; left: 0; top: 0;
            display: flex; flex-direction: column;
        }
        .sidebar .nav-link { color: rgba(255,255,255,0.75); padding: 1rem 1.5rem; border-radius: 0; }
        .sidebar .nav-link.active { color: #fff; background-color: #0d6efd; font-weight: 500; }
        .main-content { margin-left: 250px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
        .main-content > .content-area { flex: 1; padding: 2rem; }
        .user-dropdown { background-color: #2c2c2c; padding: 1rem; margin-top: auto; }
        footer { margin-top: auto; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; overflow-x: auto; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="p-3 border-bottom">
            <h4 class="mb-0">Меню</h4>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Главная</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/catalog' %}active{% endif %}" href="/catalog">Категории</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/orders' %}active{% endif %}" href="/orders">Заказы</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == '/contacts' %}active{% endif %}" href="/contacts">Контакты</a>
            </li>
        </ul>
        <div class="user-dropdown">
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
                    <img src="https://via.placeholder.com/32" width="32" height="32" class="rounded-circle me-2">
                    <strong>Пользователь</strong>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark">
                    <li><a class="dropdown-item" href="#">Профиль</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="#">Выход</a></li>
                </ul>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
        <footer class="py-3 border-top text-muted small">
            <div class="px-4">
                &copy; 2026 Магазин. Все права защищены.
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
